[package]
name = "macrd-server-linux"
version = "0.1.0"
edition = "2021"
description = "macrd server for Linux: share an X11 desktop with macrd clients"

[[bin]]
name = "macrd-server-linux"
path = "src/main.rs"

[dependencies]
macrd-proto = { path = "../proto" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "macros", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
sha2 = "0.10"
getrandom = { version = "0.2", features = ["std"] }
dirs = "6"
libc = "0.2"
ffmpeg-next = "9"
x11rb = { version = "0.13", features = ["shm", "xfixes", "damage", "randr", "xtest"] }
arboard = { version = "3", features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png"] }
